    <div class="q-text t" data-ar="ما هو أول شيء يجب أن يحتويه أي برنامج C++ ليعمل؟" data-en="What is the first thing every C++ program must have to run?"></div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) المتغيرات" data-en="A) Variables"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ب) دالة main()" data-en="B) The main() function"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ج) تعليقات" data-en="C) Comments"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) #define" data-en="D) #define"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: دالة main()" data-en="Answer: The main() function"></span></strong><br>
      <span class="t"
        data-ar="أي برنامج C++ لازم يحتوي على main() لأن التشغيل بيبدأ منها. من غيرها البرنامج مش هيشتغل."
        data-en="Every C++ program must have a main() function because execution starts there. Without it, the program won't run.">
      </span>
    </div>

      <button class="nav-btn primary" onclick="nextQ(1)"><span class="t" data-ar="التالي →" data-en="Next →"></span></button>

  <!-- Q2 -->
  <div class="question-card" id="q2">
    <div class="q-num"><span class="t" data-ar="السؤال ٢ من ١٠" data-en="Question 2 of 10"></span></div>
    <div class="q-text t" data-ar="ما ناتج الكود التالي؟" data-en="What is the output of the following code?"></div>
    <div class="code-snippet">int x = 1, y = 2;
double result = x / y;
cout &lt;&lt; result;</div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) 0.5" data-en="A) 0.5"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ب) 0" data-en="B) 0"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ج) 0.0000" data-en="C) 0.0000"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) خطأ في الكمبايل" data-en="D) Compile Error"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: 0" data-en="Answer: 0"></span></strong><br>
      <span class="t"
        data-ar="x و y كلاهما int، فـ x/y = 1/2 = 0 (integer division تحذف الكسر). ثم 0 يتحول لـ double فيصبح 0.0"
        data-en="x and y are both int, so x/y = 1/2 = 0 (integer division truncates the decimal). Then 0 is converted to double becoming 0.0">
      </span>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prevQ(2)"><span class="t" data-ar="← السابق" data-en="← Prev"></span></button>
      <button class="nav-btn primary" onclick="nextQ(2)"><span class="t" data-ar="التالي →" data-en="Next →"></span></button>
    </div>
  </div>

  <!-- Q3 -->
  <div class="question-card" id="q3">
    <div class="q-num"><span class="t" data-ar="السؤال ٣ من ١٠" data-en="Question 3 of 10"></span></div>
    <div class="q-text t" data-ar="أي من التالي اسم متغير صحيح في C++؟" data-en="Which of the following is a valid variable name in C++?"></div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) 4myVar" data-en="A) 4myVar"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ب) my-var" data-en="B) my-var"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ج) _myVar" data-en="C) _myVar"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) int" data-en="D) int"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: _myVar" data-en="Answer: _myVar"></span></strong><br>
      <span class="t"
        data-ar="— 4myVar يبدأ برقم ❌ — my-var فيه شرطة ناقص ❌ — int كلمة محجوزة ❌ — _myVar يبدأ بـ underscore ✅"
        data-en="— 4myVar starts with a digit ❌ — my-var contains a minus sign ❌ — int is a reserved keyword ❌ — _myVar starts with underscore ✅">
      </span>
    </div>
    <div class="nav-btns">

    <div class="q-text t" data-ar="ما الفرق بين \n و endl في C++؟" data-en="What is the difference between \n and endl in C++?"></div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) endl للأرقام و \n للنصوص" data-en="A) endl is for numbers and \n is for text"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ب) \n للأعداد الكبيرة" data-en="B) \n is for large numbers"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ج) كلاهما ينقل للسطر التالي، endl أكثر وضوحاً" data-en="C) Both move to a new line, endl also flushes the buffer"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) \n يطبع حرف n" data-en="D) \n prints the letter n"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: كلاهما ينقل للسطر التالي" data-en="Answer: Both move to a new line"></span></strong><br>
      <span class="t"
        data-ar="\n و endl بيعملوا نفس الوظيفة (سطر جديد). الفرق إن endl بيفضي الـ buffer أيضاً، لكن في الاستخدام العادي هما متكافئين."
        data-en="\n and endl both create a new line. The difference is that endl also flushes the output buffer, but in normal use they are equivalent.">
      </span>
    </div>

    <div class="q-text t" data-ar="ما نوع البيانات المناسب لتخزين قيمة الراتب 5500.75؟" data-en="What is the appropriate data type to store the value 5500.75?"></div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) int" data-en="A) int"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ب) char" data-en="B) char"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ج) double أو float" data-en="C) double or float"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) bool" data-en="D) bool"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: double أو float" data-en="Answer: double or float"></span></strong><br>
      <span class="t"
        data-ar="5500.75 رقم عشري، فنحتاج float أو double. int فقط للأعداد الصحيحة. double أفضل لأنه أدق."
        data-en="5500.75 is a decimal number, so we need float or double. int is only for whole numbers. double is preferred for better precision.">
      </span>
    </div>

    <div class="q-text t" data-ar="ما ناتج التعبير التالي؟" data-en="What is the output of the following expression?"></div>
    <div class="code-snippet">cout &lt;&lt; double(1) / 2;</div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) 0" data-en="A) 0"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ب) 0.5" data-en="B) 0.5"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ج) 1" data-en="C) 1"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) خطأ" data-en="D) Error"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: 0.5" data-en="Answer: 0.5"></span></strong><br>
      <span class="t"
        data-ar="double(1) بتحول الـ 1 لـ double، فبقت 1.0 / 2 = 0.5 (مش integer division)"
        data-en="double(1) casts 1 to double, so it becomes 1.0 / 2 = 0.5 (not integer division)">
      </span>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prevQ(6)"><span class="t" data-ar="← السابق" data-en="← Prev"></span></button>

  <!-- Q9 -->
  <div class="question-card" id="q9">
    <div class="q-num"><span class="t" data-ar="السؤال ٩ من ١٠" data-en="Question 9 of 10"></span></div>
    <div class="q-text t" data-ar="ما نوع الخطأ في الكود التالي؟" data-en="What type of error exists in the following code?"></div>
    <div class="code-snippet">int x = 5
cout &lt;&lt; x;</div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="أ) Syntax Error — خطأ في الكتابة" data-en="A) Syntax Error — writing mistake"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ب) Logic Error — خطأ منطقي" data-en="B) Logic Error — logical mistake"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ج) Run-time Error — خطأ وقت التشغيل" data-en="C) Run-time Error — runtime mistake"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) لا يوجد خطأ" data-en="D) No error"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: Syntax Error" data-en="Answer: Syntax Error"></span></strong><br>
      <span class="t"
        data-ar="السطر الأول int x = 5 ناقصه فاصلة منقوطة ; — ده خطأ في الكتابة والـ Compiler هيكتشفه."
        data-en="The first line int x = 5 is missing a semicolon ; — this is a syntax error that the compiler will detect.">
      </span>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prevQ(9)"><span class="t" data-ar="← السابق" data-en="← Prev"></span></button>
      <button class="nav-btn primary" onclick="nextQ(9)"><span class="t" data-ar="التالي →" data-en="Next →"></span></button>
    </div>
  </div>

  <!-- Q10 -->
  <div class="question-card" id="q10">
    <div class="q-num"><span class="t" data-ar="السؤال ١٠ من ١٠" data-en="Question 10 of 10"></span></div>
    <div class="q-text t" data-ar="ما الـ #include اللازم لاستخدام cout و cin؟" data-en="Which #include is required to use cout and cin?"></div>
    <div class="options">
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="أ) #include &lt;stdio.h&gt;" data-en="A) #include &lt;stdio.h&gt;"></span></button>
      <button class="option-btn" onclick="answer(this, true)"><span class="t" data-ar="ب) #include &lt;iostream&gt;" data-en="B) #include &lt;iostream&gt;"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="ج) #include &lt;string&gt;" data-en="C) #include &lt;string&gt;"></span></button>
      <button class="option-btn" onclick="answer(this, false)"><span class="t" data-ar="د) #include &lt;math.h&gt;" data-en="D) #include &lt;math.h&gt;"></span></button>
    </div>
    <div class="explanation">
      <strong>✅ <span class="t" data-ar="الإجابة: #include &lt;iostream&gt;" data-en="Answer: #include &lt;iostream&gt;"></span></strong><br>
      <span class="t"
        data-ar="iostream اختصار Input-Output Stream — بتضيف تعريفات cout و cin و endl."
        data-en="iostream stands for Input-Output Stream — it provides the definitions for cout, cin, and endl.">
      </span>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prevQ(10)"><span class="t" data-ar="← السابق" data-en="← Prev"></span></button>
      <button class="nav-btn primary" onclick="showResult()"><span class="t" data-ar="إنهاء الاختبار 🎯" data-en="Finish Quiz 🎯"></span></button>
    </div>
  </div>

  <!-- Result -->
  <div id="result-screen">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-score" id="result-score">0/10</div>
    <div class="result-label t" data-ar="درجتك في اختبار المحاضرة الأولى" data-en="Your score in Lecture 1 Quiz"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-actions">
      <a href="quiz2.html" class="result-btn primary"><span class="t" data-ar="التالي: Quiz 2 →" data-en="Next: Quiz 2 →"></span></a>
      <button onclick="resetQuiz()" class="result-btn secondary"><span class="t" data-ar="🔄 إعادة الاختبار" data-en="🔄 Retry Quiz"></span></button>
    </div>
  </div>

</div>

<script>
let score = 0;
let answered = new Array(10).fill(false);
let current = 1;
const total = 10;
let currentLang = 'ar';

const strings = {
  ar: {
    progress: (c, t) => `السؤال ${c} من ${t}`,
    score: (s) => `الدرجة: ${s}`,
    emoji100: '🏆', msg100: 'ممتاز! أجبت على كل الأسئلة بشكل صحيح!',
    emoji80:  '🎉', msg80:  'أحسنت! نتيجة رائعة جداً!',
    emoji60:  '👍', msg60:  'جيد! ارجع راجع المحاضرة في النقاط اللي غلطت فيها.',
    emojiLow: '📚', msgLow: 'تحتاج مراجعة أكثر. اقرأ المحاضرة مرة تانية وحاول تاني!'
  },
  en: {
    progress: (c, t) => `Question ${c} of ${t}`,
    score: (s) => `Score: ${s}`,
    emoji100: '🏆', msg100: 'Perfect! You answered all questions correctly!',
    emoji80:  '🎉', msg80:  'Great job! Excellent result!',
    emoji60:  '👍', msg60:  'Good! Review the lecture topics you got wrong.',
    emojiLow: '📚', msgLow: 'You need more review. Read the lecture again and retry!'
  }
};

function setLang(lang, btn) {
  currentLang = lang;
  document.body.className = 'lang-' + lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.t[data-ar][data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });

  updateProgress();
  updateScoreDisplay();
}

function updateProgress() {
  document.getElementById('progress-fill').style.width = ((current - 1) / total * 100) + '%';
  document.getElementById('progress-text').textContent = strings[currentLang].progress(current, total);
}

function updateScoreDisplay() {
  document.getElementById('score-display').textContent = strings[currentLang].score(score);
}

function answer(btn, correct) {
  const card = btn.closest('.question-card');
  const qIndex = parseInt(card.id.replace('q', '')) - 1;
  if (answered[qIndex]) return;

  answered[qIndex] = true;
  const buttons = card.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  if (correct) {
    btn.classList.add('correct');
    score++;
    updateScoreDisplay();
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => { if (b.onclick.toString().includes('true')) b.classList.add('correct'); });
  }
  card.querySelector('.explanation').classList.add('show');
}

function nextQ(n) {
  document.getElementById('q' + n).classList.remove('active');
  if (n < total) {
    document.getElementById('q' + (n + 1)).classList.add('active');
    current = n + 1;
    updateProgress();
  }
}

function prevQ(n) {
  document.getElementById('q' + n).classList.remove('active');
  document.getElementById('q' + (n - 1)).classList.add('active');
  current = n - 1;
  updateProgress();
}

function showResult() {
  document.getElementById('q10').classList.remove('active');
  document.getElementById('progress-fill').style.width = '100%';

  const pct = score / total;
  const s = strings[currentLang];
  let emoji, msg;
  if (pct === 1)       { emoji = s.emoji100; msg = s.msg100; }
  else if (pct >= 0.8) { emoji = s.emoji80;  msg = s.msg80; }
  else if (pct >= 0.6) { emoji = s.emoji60;  msg = s.msg60; }
  else                 { emoji = s.emojiLow; msg = s.msgLow; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-score').textContent = score + ' / ' + total;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-screen').style.display = 'block';
}

function resetQuiz() {
  score = 0;
  answered = new Array(10).fill(false);
  current = 1;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('progress-fill').style.width = '0%';
  updateProgress();
  updateScoreDisplay();

  for (let i = 1; i <= total; i++) {
    const card = document.getElementById('q' + i);
    card.classList.remove('active');
    card.querySelectorAll('.option-btn').forEach(b => {
      b.disabled = false;
      b.classList.remove('correct', 'wrong');
    });
    card.querySelector('.explanation').classList.remove('show');
  }
  document.getElementById('q1').classList.add('active');
}

// Init
updateProgress();
updateScoreDisplay();
document.querySelectorAll('.t[data-ar]').forEach(el => {
  el.textContent = el.dataset.ar;
});
</script>
</body>
</html>
